name: Build Exe

on: workflow_dispatch

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Create hook file
        run: |
          mkdir hooks
          echo "from PyInstaller.utils.hooks import copy_metadata" > hooks/hook-streamlit.py
          echo "datas = copy_metadata('streamlit')" >> hooks/hook-streamlit.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller streamlit openai google-genai python-dotenv pyqt6 pyqtwebengine

      - name: Build EXE
        run: |
          pyinstaller --noconfirm --onedir --windowed --additional-hooks-dir=hooks --add-data "app.py;." --copy-metadata streamlit runner.py

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gemini-AI-Studio-EXE
          path: dist/runner/
